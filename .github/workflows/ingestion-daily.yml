name: Floats Daily Event Ingestion
# Scheduled workflows only run from the repository default branch; this file does nothing until it is merged there.
# 09:15 UTC is 05:15 EDT in summer and 04:15 EST in winter (GitHub cron is UTC-only; it is not DST aware).
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floats-ingestion-daily
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    # Budget: install (~5) + collect step (30, worker deadline 25) + verify step (20, worker deadline 15) + slack.
    timeout-minutes: 60
    # Secrets must come from an ISOLATED (staging) project until the launch checklist is signed off.
    env:
      INGESTION_PUBLISH_MODE: shadow
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      # Chromium is deliberately NOT installed: browser rendering is disabled until network containment exists.
      - name: Collect
        timeout-minutes: 30
        run: npm run ingest:daily
      # Runs even when collection fails or times out. Steps are sequential in one job, and collection, verification and replay share one database run lock, so they can never run concurrently; if another run holds it, verify only performs its read-only checks.
      - name: Verify
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run ingest:verify
